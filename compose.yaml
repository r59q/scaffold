name: scaffold-demo

services:
  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(response => process.exit(response.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5
